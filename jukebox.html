<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oh Hell! Jukebox</title>
<style>
  :root { --gold: #e8b85a; --ink: #f4e6c8; --dim: #b89c78; --panel: rgba(30, 14, 8, 0.88); --edge: #8a5a32; --hot: #ff7a2a; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; color: var(--ink); font-family: Georgia, "Times New Roman", serif;
    background: radial-gradient(ellipse at 50% 30%, #4a1a0c 0%, #1e0a05 55%, #090302 100%) fixed; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }
  header { text-align: center; margin-bottom: 18px; }
  header img { width: min(340px, 80vw); filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.7)); }
  h1 { margin: 4px 0 2px; font-size: 30px; letter-spacing: 0.06em; color: var(--gold); text-shadow: 0 2px 6px #000; }
  .sub { color: var(--dim); font-style: italic; margin: 0; }
  .deck { display: grid; gap: 12px; margin-top: 18px; }
  .track { display: grid; grid-template-columns: 58px 1fr; gap: 14px; align-items: center; padding: 14px 16px;
    background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45); transition: border-color 0.2s, box-shadow 0.2s; }
  .track.playing { border-color: var(--hot); box-shadow: 0 0 0 1px var(--hot), 0 0 24px rgba(255, 110, 30, 0.35); }
  .play { width: 58px; height: 58px; border-radius: 50%; border: 2px solid var(--gold); background: #2a1208; color: var(--gold);
    font-size: 22px; cursor: pointer; display: grid; place-items: center; }
  .play:hover { background: #3d1a0c; }
  .track.playing .play { background: var(--hot); color: #1e0a05; border-color: var(--hot); }
  .track h2 { margin: 0; font-size: 20px; color: var(--gold); }
  .track .meta { font-size: 13px; color: var(--dim); margin: 2px 0 6px; letter-spacing: 0.03em; }
  .track p { margin: 0; font-size: 15px; line-height: 1.4; }
  .bar { height: 4px; margin-top: 10px; background: rgba(255, 255, 255, 0.08); border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #a8321a, var(--hot)); }
  .reg { display: inline-flex; margin-top: 8px; border: 1px solid var(--edge); border-radius: 7px; overflow: hidden; }
  .reg button { background: #2a1208; color: var(--dim); border: 0; padding: 4px 12px; font: 13px Georgia, serif; cursor: pointer; }
  .reg button.on { background: var(--gold); color: #1e0a05; }
  .controls { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 20px; color: var(--dim); font-size: 14px; }
  .controls input { width: 220px; accent-color: var(--hot); }
  .note { text-align: center; color: var(--dim); font-size: 13px; margin-top: 18px; font-style: italic; }
</style>
</head>
<body>
<main>
  <header>
    <img src="logo-ohhell.webp" alt="Oh Hell! Extended">
    <h1>The Infernal Jukebox</h1>
    <p class="sub">Sketches for the game's music: press a record to play it</p>
  </header>
  <div class="deck" id="deck"></div>
  <div class="controls"><label for="vol">Volume</label><input id="vol" type="range" min="0" max="1" step="0.01" value="0.7"></div>
  <p class="note">Everything here is synthesised live in your browser: no recordings, nothing downloaded.</p>
</main>
<script src="oh-music.js?v=2"></script>
<script>
// the instruments and tunes live in oh-music.js (shared with the game)
const { A4, NAMES, midiOf, hz, CHORD, chordOf, Synth, parseBar, bars, rests, sectionOf, TUNES, ORGAN, organised, chipped } = OHMusicLib;
let ctx = null, S = null, now = null;
function stop() {
  if (!now) return;
  clearInterval(now.timer); (now.extra || []).forEach(f => f());
  const g = now.bus.gain, t = ctx.currentTime; g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(0, t + 0.4);
  const bus = now.bus; setTimeout(() => bus.disconnect(), 600);
  document.querySelectorAll(".track").forEach(el => el.classList.remove("playing"));
  document.querySelectorAll(".play").forEach(el => (el.textContent = "▶"));
  document.querySelectorAll(".bar i").forEach(el => (el.style.width = "0"));
  now = null;
}
function play(tune) {
  if (!ctx) { ctx = new (window.AudioContext || window.webkitAudioContext)(); S = new Synth(ctx); S.out.gain.value = +document.getElementById("vol").value; }
  if (ctx.state === "suspended") ctx.resume();
  stop();
  const onOrgan = tune.organ && tune.useOrgan;
  const bus = S.bus(tune.send || 1); bus.gain.value = (tune.gain || 1) * (onOrgan ? tune.organGain || 1 : 1);
  const player = onOrgan ? organised(S, tune, bus) : tune.sid ? chipped(S,bus) : S;
  const el = document.getElementById("t-" + tune.id), bar = el.querySelector(".bar i");
  el.classList.add("playing"); el.querySelector(".play").textContent = "■";
  now = { tune, bus, extra: player.release ? [() => setTimeout(player.release, 600)] : [] };
  if (tune.ambient) { ambient(bus, bar, tune.echoes); return; }
  const beat = 60 / tune.bpm, n = tune.chords.length;
  let b = 0, at = ctx.currentTime + 0.15;
  const schedule = () => {
    while (at < ctx.currentTime + 0.6) {
      const i = b % n, ch = chordOf(tune.chords[i]), next = chordOf(tune.chords[(i + 1) % n]);
      tune.accomp(player, bus, at, i, ch, beat, next);
      for (const p of tune.parts) for (const ev of p.notes[i] || []) {
        if (onOrgan && (tune.organSkip || []).includes(p.inst)) continue;
        let pos = ev.at;
        if (tune.swing && Math.abs(pos % 1 - 0.5) < 0.01) pos = Math.floor(pos) + tune.swing;   // lazy off-beats
        for (const m of ev.midi) player[p.inst](at + pos * beat, hz(m + p.shift + (onOrgan && (p.inst === "sax" || p.inst === "bassoon") ? 12 : 0)), ev.beats * beat * 0.95, ev.vel ?? p.vel, bus);
      }
      const start = at; setTimeout(() => { if (now && now.bus === bus) bar.style.width = ((i + 1) / n * 100) + "%"; }, Math.max(0, (start - ctx.currentTime) * 1000));
      at += tune.beats * beat; b++;
    }
  };
  schedule(); now.timer = setInterval(schedule, 100);
}
// The Souls Below: a drone that never stops, choir chords drifting through, groans and crackle at random.
function ambient(bus, bar, echoes) {
  const t = ctx.currentTime + 0.1, drone = [];
  [[38, 0.12], [45, 0.07], [26, 0.1]].forEach(([m, v]) => {
    const o = ctx.createOscillator(); o.type = "sawtooth"; o.frequency.value = hz(m) * (1 + (Math.random() - 0.5) * 0.004);
    const lp = S.filter("lowpass", 380, 2), lfo = ctx.createOscillator(), lg = ctx.createGain();
    lfo.frequency.value = 0.04 + Math.random() * 0.04; lg.gain.value = 180; lfo.connect(lg); lg.connect(lp.frequency);
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 4);
    o.connect(lp); lp.connect(g); g.connect(bus); o.start(t); lfo.start(t); drone.push(o, lfo);
  });
  now.extra.push(() => drone.forEach(o => { try { o.stop(ctx.currentTime + 0.5); } catch (e) {} }));
  const CH = [["D3", "F3", "A3", "D4"], ["Bb2", "F3", "Bb3", "D4"], ["G2", "D3", "G3", "Bb3"], ["A2", "E3", "A3", "C#4"]];
  let ci = 0, nextChoir = t + 2, nextGroan = t + 4, nextCrack = t, ticks = 0;
  const loop = () => {
    const c = ctx.currentTime;
    while (nextChoir < c + 1) { CH[ci % 4].forEach(n => S.choir(nextChoir, hz(midiOf(n)), 7, 1, S.pan(bus, Math.random() - 0.5))); ci++; nextChoir += 8; }
    while (nextGroan < c + 1) { S.groan(nextGroan, bus); nextGroan += 3 + Math.random() * 6; }
    while (nextCrack < c + 0.5) { S.hit(nextCrack, 0.02 + Math.random() * 0.07, bus, 2500 + Math.random() * 3000, 1, 0.012 + Math.random() * 0.02, "highpass"); nextCrack += 0.05 + Math.random() * 0.4; }
    if (echoes && nextEcho < c + 1) { echo(nextEcho, ghosts); nextEcho += 22 + Math.random() * 20; }
    bar.style.width = (((c - t) % 32) / 32 * 100) + "%";
  };
  // the ghosts: everything goes through one muffled, echoing channel that fades with the track
  let nextEcho = t + 9 + Math.random() * 6, ghosts = null;
  if (echoes) {
    ghosts = ctx.createGain(); ghosts.gain.value = 0.55;
    const muffle = S.filter("lowpass", 1500, 0.7), wet = ctx.createGain(); wet.gain.value = 4;
    ghosts.connect(muffle); muffle.connect(bus); muffle.connect(wet); wet.connect(S.verb);
    now.extra.push(() => { const g = ghosts.gain, n = ctx.currentTime; g.cancelScheduledValues(n); g.setValueAtTime(g.value, n); g.linearRampToValueAtTime(0, n + 0.4); });
    window.__echoNow = () => echo(ctx.currentTime + 0.2, ghosts);
  }
  loop(); now.timer = setInterval(loop, 100);
}
// One ghost: four bars of another tune's melody, slowed to two-thirds speed, moved into D minor to sit over
// the drone, swelling in and dying away.
const TO_D = { black: 2, parlour: 0, danse: -5, cardroom: 2 };
function echo(t, dest) {
  const tunes = TUNES.filter(x => x.parts && TO_D[x.id] != null), tune = tunes[Math.floor(Math.random() * tunes.length)];
  const part = tune.parts.filter(p => p.notes.some(b => b.length))[0];
  const starts = []; for (let i = 0; i + 3 < part.notes.length; i += 4) if (part.notes.slice(i, i + 4).some(b => b.length)) starts.push(i);
  const from = starts[Math.floor(Math.random() * starts.length)], beat = 60 / (tune.bpm * 0.66), len = 4 * tune.beats * beat;
  const inst = tune.organ ? "organLead" : part.inst, up = tune.organ && (part.inst === "sax" || part.inst === "bassoon") ? 12 : 0;
  const env = ctx.createGain(); env.gain.setValueAtTime(0.0001, t);
  env.gain.exponentialRampToValueAtTime(1, t + len * 0.3); env.gain.setValueAtTime(1, t + len * 0.6); env.gain.exponentialRampToValueAtTime(0.0001, t + len + 1.5);
  env.connect(S.pan(dest, Math.random() * 1.2 - 0.6));
  for (let k = 0; k < 4; k++) for (const ev of part.notes[from + k] || []) for (const m of ev.midi)
    S[inst](t + (k * tune.beats + ev.at) * beat, hz(m + part.shift + up + TO_D[tune.id]), ev.beats * beat * 0.95, 0.75, env);
  if (now) now.ghost = tune.title;
}

// ===================================================================== the page
document.getElementById("deck").innerHTML = TUNES.map(t => `<article class="track" id="t-${t.id}">
  <button class="play" type="button" aria-label="Play ${t.title}">▶</button>
  <div><h2>${t.title}</h2><div class="meta">${t.meta}</div><p>${t.desc}</p>
  ${t.organ ? `<div class="reg"><button type="button" data-r="organ" class="${t.useOrgan ? "on" : ""}">Organ</button><button type="button" data-r="orch" class="${!t.useOrgan ? "on" : ""}">Orchestra</button></div>` : ""}
  <div class="bar"><i></i></div></div></article>`).join("");
TUNES.filter(t => t.organ).forEach(t => document.querySelectorAll(`#t-${t.id} .reg button`).forEach(btn => btn.addEventListener("click", () => {
  t.useOrgan = btn.dataset.r === "organ";
  document.querySelectorAll(`#t-${t.id} .reg button`).forEach(x => x.classList.toggle("on", x === btn));
  if (now && now.tune === t) play(t);
})));
TUNES.forEach(t => document.querySelector(`#t-${t.id} .play`).addEventListener("click", () => (now && now.tune === t ? stop() : play(t))));
document.getElementById("vol").addEventListener("input", e => { if (S) S.out.gain.value = +e.target.value; });
// for testing: render a tune offline
window.__render = async (id, secs) => {
  const off = new OfflineAudioContext(2, 44100 * secs, 44100), s = new Synth(off), tune = TUNES.find(x => x.id === id), bus = s.bus(tune.send || 1); bus.gain.value = (tune.gain || 1) * (tune.organ && tune.useOrgan ? tune.organGain || 1 : 1);
  if (!tune.ambient) {
    const beat = 60 / tune.bpm; let at = 0.05, b = 0;
    const og = tune.organ && tune.useOrgan, P = og ? organised(s, tune, bus) : tune.sid ? chipped(s,bus) : s;
    while (at < secs) { const i = b % tune.chords.length, ch = chordOf(tune.chords[i]), next = chordOf(tune.chords[(i + 1) % tune.chords.length]);
      tune.accomp(P, bus, at, i, ch, beat, next);
      for (const p of tune.parts) { if (og && (tune.organSkip || []).includes(p.inst)) continue;
        for (const ev of p.notes[i] || []) for (const m of ev.midi) {
          const pos = tune.swing && Math.abs(ev.at % 1 - 0.5) < 0.01 ? Math.floor(ev.at) + tune.swing : ev.at;
          P[p.inst](at + pos * beat, hz(m + p.shift + (og && (p.inst === "sax" || p.inst === "bassoon") ? 12 : 0)), ev.beats * beat * 0.95, ev.vel ?? p.vel, bus); } }
      at += tune.beats * beat; b++; }
  }
  const buf = await off.startRendering(), d = buf.getChannelData(0);
  let peak = 0, sum = 0; for (const x of d) { peak = Math.max(peak, Math.abs(x)); sum += x * x; }
  return { peak: +peak.toFixed(3), rms: +Math.sqrt(sum / d.length).toFixed(4), bars: tune.chords ? tune.chords.length : 0, partBars: tune.parts ? tune.parts.map(p => p.notes.length) : [] };
};
</script>
</body>
</html>
